<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ডাক্তারের লিফলেট</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6ef;--card:#fff;--tx:#14213d;--mut:#5b6785;--gn:#0f8a4f;--yl:#f5b800;--bd:#cfe6d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d17;--card:#17291f;--tx:#eaf6ef;--mut:#9cc2ad;--bd:#27412f}}
:root[data-theme="dark"]{--bg:#0f1d17;--card:#17291f;--tx:#eaf6ef;--mut:#9cc2ad;--bd:#27412f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Anek Bangla','Poppins',system-ui,sans-serif;font-size:22px}
.wrap{max-width:1200px;margin:auto;padding:16px}
h1{font-size:32px;margin:0;font-weight:800}
.top{background:linear-gradient(120deg,#0f8a4f,#2fc07a);color:#fff;border-radius:26px;padding:22px;display:flex;gap:16px;align-items:center;margin-bottom:20px}
.top .ic{font-size:54px}.top div div{font-size:19px}
.card{background:var(--card);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 6px 18px rgba(15,138,79,.12)}
button{font:inherit;font-size:20px;cursor:pointer;border:0;border-radius:18px;padding:16px 24px;font-weight:700;background:var(--gn);color:#fff}
button:active{transform:scale(.97)}
button.sec{background:var(--card);color:var(--gn);border:3px solid var(--gn)}
button.yl{background:#e8a800;color:#222}button.rd{background:var(--card);color:#c62828;border:3px solid #c62828;font-size:16px;padding:10px 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tile{background:var(--card);border-radius:26px;padding:22px 12px;box-shadow:0 6px 18px rgba(15,138,79,.14);cursor:pointer;text-align:center;font-weight:700;border:3px solid transparent;line-height:1.3}
.tile:hover{border-color:var(--gn)}.tile:active{transform:scale(.97)}
.tile .av{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:50px;background:#dcf3e6;overflow:hidden}
.tile .av img{width:100%;height:100%;object-fit:cover}
.tile.add{border:3px dashed var(--gn);background:transparent;color:var(--gn);box-shadow:none}.tile.add .av{background:#fff;font-size:58px}
.step{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:700;margin:22px 0 10px}.step:first-child{margin-top:4px}
.num{width:42px;height:42px;border-radius:50%;background:var(--yl);color:#222;display:flex;align-items:center;justify-content:center;flex:none}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:18px}
input[type=text],textarea{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:3px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx)}
input:focus,textarea:focus{outline:0;border-color:var(--gn)}
textarea{min-height:92px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--gn);height:34px}
.edit{display:grid;grid-template-columns:420px 1fr;gap:16px;align-items:start}
@media(max-width:950px){.edit{grid-template-columns:1fr}}
.stage{background:var(--card);border-radius:24px;padding:12px;position:sticky;top:8px}
canvas{width:100%;height:auto;border-radius:14px;display:block}
.ok{background:#e1f6ea;color:#14663a;border-radius:14px;padding:10px 14px;font-size:17px;margin-top:14px}
.up{display:inline-block;border:3px solid var(--gn);color:var(--gn);padding:14px 20px;border-radius:18px;cursor:pointer;font-weight:700}
</style></head><body>

function upPhoto(inp){const f=inp.files[0];if(!f)return;const png=f.type==='image/png',r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.height),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cur.photoOrig=c.toDataURL(png?'image/png':'image/jpeg',.88);cur.photo='';cur.bt=0;cur.ps=100;cur.px=0;cur.py=0;save();editor()};im.src=r.result};r.readAsDataURL(f)}

async function removeBg(src,tol){
 const im=await loadImg(src);const k=Math.min(1,700/im.height),w=Math.round(im.width*k),h=Math.round(im.height*k);
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
 const id=x.getImageData(0,0,w,h),p=id.data,N=w*h,lim=Math.floor(h*.7);
 let r=0,g=0,b=0,n=0;const add=i=>{r+=p[i*4];g+=p[i*4+1];b+=p[i*4+2];n++};
 for(let i=0;i<w;i++)add(i);for(let j=0;j<lim;j++){add(j*w);add(j*w+w-1)}
 r/=n;g/=n;b/=n;
 const gl=tol*2.4,lc=tol*.55,bm=new Uint8Array(N),st=[];
 const dist=(i,r2,g2,b2)=>{const a=p[i*4]-r2,d=p[i*4+1]-g2,e=p[i*4+2]-b2;return Math.sqrt(a*a+d*d+e*e)};
 const seed=i=>{if(!bm[i]&&dist(i,r,g,b)<gl){bm[i]=1;st.push(i)}};
 for(let i=0;i<w;i++)seed(i);for(let j=0;j<lim;j++){seed(j*w);seed(j*w+w-1)}
 while(st.length){const i=st.pop(),x0=i%w,y0=(i/w)|0,pr=p[i*4],pg=p[i*4+1],pb=p[i*4+2];
  for(const q of [x0>0?i-1:-1,x0<w-1?i+1:-1,y0>0?i-w:-1,y0<h-1?i+w:-1]){if(q<0||bm[q])continue;if(dist(q,pr,pg,pb)<lc&&dist(q,r,g,b)<gl){bm[q]=1;st.push(q)}}}
 let a=new Float32Array(N);for(let i=0;i<N;i++)a[i]=bm[i]?0:1;
 for(let it=0;it<2;it++){const t=new Float32Array(N);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let s=0,m=0;for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-1;dx<=1;dx++){const x3=xx+dx;if(x3<0||x3>=w)continue;s+=a[yy*w+x3];m++}}t[y*w+xx]=s/m}a=t}
 for(let i=0;i<N;i++)p[i*4+3]=Math.round(Math.max(0,Math.min(1,(a[i]-.25)/.5))*255);
 x.putImageData(id,0,0);return c.toDataURL('image/png')}

function wrap(ctx,text,maxW){const out=[];String(text||'').split('\n').forEach(p=>{let line='';p.split(/\s+/).filter(Boolean).forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});if(line)out.push(line)});return out}
function fit(ctx,text,wt,fam,maxW,maxH,from,to,lh){let f=from,L;for(;f>=to;f--){ctx.font=`${wt} ${f}px ${fam}`;L=wrap(ctx,text,maxW);if(L.length*f*lh<=maxH)break}return{f,L,lh:f*lh}}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function icon(c,t,s){c.beginPath();const arc=(x,y,r)=>{c.moveTo(x+r,y);c.arc(x,y,r,0,7)};
 if(t===0){arc(0,0,s*.5);c.moveTo(-s*.25,0);c.lineTo(s*.25,0);c.moveTo(0,-s*.25);c.lineTo(0,s*.25)}
 else if(t===1){rr(c,-s*.55,-s*.25,s*1.1,s*.5,s*.25);c.moveTo(0,-s*.25);c.lineTo(0,s*.25)}
 else if(t===2){rr(c,-s*.6,-s*.2,s*1.2,s*.4,s*.12);arc(-s*.15,0,s*.05);arc(s*.15,0,s*.05);arc(0,0,s*.05)}
