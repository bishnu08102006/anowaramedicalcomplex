<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ডাক্তার প্যাড জেনারেটর</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fc;--card:#fff;--tx:#14213d;--mut:#5b6785;--bl:#0b4fb3;--yl:#f5b800;--gr:#1e9e5a;--bd:#d5def2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--card:#1a2340;--tx:#eef2ff;--mut:#9aa7cc;--bd:#2b3760}}
:root[data-theme="dark"]{--bg:#10162a;--card:#1a2340;--tx:#eef2ff;--mut:#9aa7cc;--bd:#2b3760}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Anek Bangla','Poppins',system-ui,sans-serif;font-size:22px}
.wrap{max-width:1200px;margin:auto;padding:16px}
h1{font-size:32px;margin:0;font-weight:800}h2{font-size:24px;margin:0 0 12px;font-weight:700}
.top{background:linear-gradient(120deg,#0b4fb3,#3b86ff);color:#fff;border-radius:26px;padding:22px;display:flex;gap:16px;align-items:center;margin-bottom:20px}
.top .ic{font-size:54px}.top div div{opacity:.95;font-size:19px}
.card{background:var(--card);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 6px 18px rgba(11,79,179,.10)}
button{font:inherit;font-size:20px;cursor:pointer;border:0;border-radius:18px;padding:16px 24px;font-weight:700;background:var(--bl);color:#fff}
button:active{transform:scale(.97)}
button.sec{background:var(--card);color:var(--bl);border:3px solid var(--bl)}
button.yl{background:var(--gr);color:#fff}button.rd{background:#fff;color:#c62828;border:3px solid #c62828;font-size:16px;padding:10px 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tile{background:var(--card);border-radius:26px;padding:22px 12px;box-shadow:0 6px 18px rgba(11,79,179,.12);cursor:pointer;text-align:center;font-weight:700;font-size:20px;border:3px solid transparent;line-height:1.3}
.tile:active{transform:scale(.97)}.tile:hover{border-color:var(--bl)}
.tile .av{width:88px;height:88px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:48px;background:#e3edff}
.tile small{display:block;font-weight:500;color:var(--mut);font-size:15px;font-family:'Poppins',sans-serif}
.tile.add{border:3px dashed var(--bl);background:transparent;color:var(--bl);box-shadow:none}.tile.add .av{background:#fff;font-size:56px;color:var(--bl)}
.tile.hos .av{background:#fff1c2}
.step{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:700;margin:6px 0 12px}
.num{width:42px;height:42px;border-radius:50%;background:var(--yl);color:#222;display:flex;align-items:center;justify-content:center;flex:none}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:18px}
input,textarea{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:3px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx)}
input:focus,textarea:focus{outline:0;border-color:var(--bl)}
textarea{min-height:100px;resize:vertical}
.en{font-family:'Poppins',sans-serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.edit{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.edit{grid-template-columns:1fr}}
.seg{display:flex;gap:8px}.seg button{background:var(--card);color:var(--bl);border:3px solid var(--bl)}.seg button.on{background:var(--bl);color:#fff}
.stage{background:#8a93a8;border-radius:20px;padding:12px;overflow:auto;display:flex;justify-content:center}
#logoPrev{height:90px;border-radius:14px;border:3px dashed var(--bd);padding:4px;background:#fff}
.ok{background:#e5f7ec;color:#14663a;border-radius:14px;padding:10px 14px;font-size:17px;margin-top:14px}
.gal{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.th{width:66px;height:66px;border:3px solid var(--bd);border-radius:12px;background:#fff;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#333;text-align:center;line-height:1.2;padding:3px}
.th.on{border-color:var(--bl);box-shadow:0 0 0 2px var(--bl)}.th img,.th svg{max-width:100%;max-height:100%}
.th i{position:absolute;top:-9px;right:-9px;background:#c62828;color:#fff;border-radius:50%;width:22px;height:22px;font-style:normal;font-size:14px;line-height:22px;text-align:center}

function home(){
 $('#editorBox').innerHTML='';
 $('#app').innerHTML=`<div class="top"><div class="ic">🩺</div><div><h1>ডাক্তার প্যাড</h1><div>কার প্যাড বানাবেন? ছবিতে চাপ দিন 👇</div></div></div>

function hosp(){
 $('#app').innerHTML=`<div class="row" style="margin-bottom:14px"><button class="sec" onclick="home()">← পিছনে</button></div>
 <div class="card"><h2>🏥 হাসপাতালের তথ্য</h2>

 <div class="row"><img id="logoPrev" src="${db.hospital.logo||LOGO}"><label style="margin:0;display:inline-block;border:3px solid var(--bl);color:var(--bl);padding:14px 20px;border-radius:18px;cursor:pointer">🖼️ নতুন লোগো দিন<input type="file" accept="image/*" hidden onchange="logo(this)"></label></div>

}
function logo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.hospital.logo=c.toDataURL('image/png');save();$('#logoPrev').src=db.hospital.logo;$('#logoPrev').style.display=''};im.src=r.result};r.readAsDataURL(f)}
function saveH(){Object.assign(db.hospital,{nameBn:$('#hb').value,nameEn:$('#he').value,addr:$('#ha').value});save()}
function newDoc(){const d={id:'d'+Date.now(),bnSpec:'',bnName:'',bnDeg:'',enName:'',enDeg:'',time:'সময় ঃ প্রতি ... বিকাল ...টা- সন্ধ্যা ...টা',wm:''};db.docs.push(d);save();openDoc(d.id)}
function openDoc(id){cur=db.docs.find(d=>d.id===id);editor()}

function renderGal(){const g=$('#gal');if(!g)return;const sel=cur.wmId===undefined?'def':cur.wmId;
 g.innerHTML=`<div class="th ${sel==='def'?'on':''}" onclick="pickWm('def')">${STETH}</div><div class="th ${sel==='none'?'on':''}" onclick="pickWm('none')">ছবি নেই</div>`+db.images.map(i=>`<div class="th ${sel===i.id?'on':''}" onclick="pickWm('${i.id}')"><img src="${i.src}"><i onclick="event.stopPropagation();delImg('${i.id}')">×</i></div>`).join('')}
function pickWm(id){cur.wmId=id==='def'?undefined:id;save();renderGal();pad()}
function addImgs(inp){[...inp.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,450/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const id='i'+Date.now()+Math.random().toString(36).slice(2,5);db.images.push({id,src:c.toDataURL('image/png')});cur.wmId=id;save();renderGal();pad()};im.src=r.result};r.readAsDataURL(f)});inp.value=''}
function delImg(id){if(!confirm('এই ছবি মুছবেন?'))return;db.images=db.images.filter(i=>i.id!==id);db.docs.forEach(d=>{if(d.wmId===id)d.wmId=undefined});save();renderGal();pad()}
function wmHtml(d){if(d.wmId==='none')return'';const i=d.wmId&&db.images.find(x=>x.id===d.wmId);return i?`<img src="${i.src}">`:STETH}
function del(){if(confirm('এই ডাক্তার মুছে ফেলবেন?')){db.docs=db.docs.filter(d=>d!==cur);save();home()}}
function setSize(s){size=s;['A4','A5'].forEach(x=>{const b=$('#b'+x);if(b)b.classList.toggle('on',x===s)});pad()}
const STETH='<svg viewBox="0 0 100 130" fill="none" stroke="#1b2a6b" stroke-width="4" stroke-linecap="round"><path d="M25 5v30a25 25 0 0 0 50 0V5"/><path d="M50 60v25a22 22 0 0 0 44 0V70"/><circle cx="94" cy="62" r="8" fill="#1b2a6b"/></svg>';

 <div class="a" style="left:61.5%;top:2.8%;width:38%;font-family:'Poppins',sans-serif"><div style="color:#a3361c;font-weight:700;font-size:1.65em;line-height:1.15">${esc(d.enName)}</div><pre style="font-size:.98em;line-height:1.28;font-weight:500;margin-top:.2em">${esc(d.enDeg)}</pre></div>
